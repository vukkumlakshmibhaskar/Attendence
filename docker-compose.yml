services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: attendance-postgres
    environment:
      POSTGRES_DB: attendance
      POSTGRES_USER: attendance
      POSTGRES_PASSWORD: ""
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - attendance_pgdata:/var/lib/postgresql/data
      - ./go-backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendance -d attendance"]
      interval: 10s
      timeout: 5s
      retries: 5

  cognitive-service:
    build:
      context: ./cognitive-service
    container_name: attendance-cognitive-service
    environment:
      COGNITIVE_ALLOW_HEURISTIC_FALLBACK: "true"
      COGNITIVE_MODEL_DIR: /app/models
    ports:
      - "8001:8001"

  go-backend:
    build:
      context: ./go-backend
    container_name: attendance-go-backend
    depends_on:
      postgres:
        condition: service_healthy
      cognitive-service:
        condition: service_started
    environment:
      HTTP_ADDR: ":8080"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: attendance
      DB_USERNAME: attendance
      DB_PASSWORD: ""
      COGNITIVE_SERVICE_URL: http://cognitive-service:8001
      MAX_FRAME_WORKERS: "4"
      FRAME_QUEUE_SIZE: "16"
      FACE_RECOGNIZER_MODE: mock
      MATCH_THRESHOLD: "0.55"
      CORS_ALLOWED_ORIGIN: http://localhost:5173
    ports:
      - "8080:8080"

  frontend:
    image: node:24-alpine
    container_name: attendance-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:8080
      VITE_SAMPLE_INTERVAL_MS: "3000"
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    depends_on:
      - go-backend

volumes:
  attendance_pgdata:
